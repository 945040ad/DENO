# Local development stack. Postgres + Auth are the hosted Supabase project
# (docs/supabase-setup.md) — nothing Supabase runs here.
#   docker compose -f compose.dev.yml up --build
name: deno-dev

services:
  api:
    build: { context: ., dockerfile: Dockerfile }
    env_file: .env
    environment:
      ENVIRONMENT: development
      VALKEY_URL: redis://valkey:6379/0
      SEARXNG_URL: http://searxng:8080
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      valkey: { condition: service_healthy }
      searxng: { condition: service_started }

  worker:
    build: { context: ., dockerfile: Dockerfile }
    command: ["taskiq", "worker", "deno_worker.tasks:broker", "--workers", "2"]
    env_file: .env
    environment:
      ENVIRONMENT: development
      VALKEY_URL: redis://valkey:6379/0
      SEARXNG_URL: http://searxng:8080
    healthcheck: { disable: true }
    depends_on:
      valkey: { condition: service_healthy }

  scheduler:
    build: { context: ., dockerfile: Dockerfile }
    command: ["taskiq", "scheduler", "deno_worker.tasks:scheduler"]
    env_file: .env
    environment:
      ENVIRONMENT: development
      VALKEY_URL: redis://valkey:6379/0
    healthcheck: { disable: true }
    depends_on:
      valkey: { condition: service_healthy }

  web:
    build:
      context: web
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        BACKEND_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]

  # Throwaway Postgres + pgvector for the integration tests only (same image as
  # CI). Real data lives in the hosted Supabase project.
  #   docker compose -f compose.dev.yml --profile test up -d postgres-test
  postgres-test:
    profiles: [test]
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: deno_test }
    ports: ["127.0.0.1:54329:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-dev-only-searxng-secret}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports: ["127.0.0.1:8890:8080"]
