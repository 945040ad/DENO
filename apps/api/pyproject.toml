[project]
name = "deno-api"
version = "0.1.0"
description = "Deno HTTP API (FastAPI)"
requires-python = ">=3.12"
dependencies = ["deno-core", "deno-gates", "deno-llm", "stripe>=12,<16", "prometheus-client>=0.21", "sentry-sdk[fastapi]>=2.20", "fastapi>=0.141,<0.142", "uvicorn[standard]>=0.52", "httpx>=0.28,<0.29", "pyjwt[crypto]>=2.12,<3"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
