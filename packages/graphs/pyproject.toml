[project]
name = "deno-graphs"
version = "0.1.0"
description = "Deno LangGraph workflows: validation graph and content graph"
requires-python = ">=3.12"
dependencies = [
  "deno-core",
  "deno-gates",
  "deno-llm",
  "deno-rag",
  "deno-sources",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "psycopg[binary,pool]>=3.2,<4",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
