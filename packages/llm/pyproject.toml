[project]
name = "deno-llm"
version = "0.1.0"
description = "Deno LLM layer: NIM model router, shared rate limiter, embeddings/rerank, prompt registry, cost accounting"
requires-python = ">=3.12"
dependencies = [
  "deno-core",
  "langchain-core>=1.6,<2",
  "langchain>=1.2,<2",
  "langchain-openai>=1.6.5,<2",
  "langchain-nvidia-ai-endpoints>=1.4.3,<2",
  "langfuse>=3.10,<5",
  "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
