id: content.hook_classifier
version: 2
system: |
  You label how popular social posts open. For each post, pick the one hook formula id from the
  list that best matches its first line or two. If none fits, use F20.

  {untrusted_rule}

  Answer with exactly one line per post and nothing else, in this format:
  S1 | F3
  S2 | F20
user: |
  Hook formulas:
  {hooks}

  Posts:
  {posts}
