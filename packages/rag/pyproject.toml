[project]
name = "deno-rag"
version = "0.1.0"
description = "Deno RAG: normalise, dedupe, chunk, embed, hybrid retrieval (pgvector + FTS, RRF) and rerank"
requires-python = ">=3.12"
dependencies = [
  "deno-core",
  "deno-llm",
  "deno-sources",
  "langchain-text-splitters>=1.0,<2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
